<!DOCTYPE html>
<!-- 木鱼网页 - 手机端适配 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 核心手机适配：禁止缩放、设置视口宽度为手机屏幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手机木鱼 - 敲出好心情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 页面整体样式：全屏、浅背景、居中对齐 */
        body {
            width: 100vw;
            height: 100vh;
            background-color: #f5f2eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "微软雅黑", sans-serif;
            /* 禁止手机长按选中文本/保存图片 */
            user-select: none;
            -webkit-user-select: none;
        }
        /* 功德计数文字：大字体、醒目 */
        .merit {
            font-size: 3rem;
            color: #8b5a2b;
            margin-bottom: 40px;
            font-weight: bold;
        }
        /* 木鱼容器：点击区域、动画触发基础 */
        .wooden-fish {
            width: 280px;
            height: 280px;
            /* 木鱼图片（在线免抠图，无需本地下载） */
            background: url("https://img1.baidu.com/it/u=3802522823,2892110239&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=500") no-repeat center;
            background-size: 100% 100%;
            /* 让鼠标/手机点击显示手型 */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* 去除手机点击蓝色高亮 */
        }
        /* 敲击动画：轻微缩放+震动，模拟敲击触感 */
        .tap {
            animation: tap 0.1s linear;
        }
        /* 动画关键帧：缩小后恢复，实现敲击反馈 */
        @keyframes tap {
            0% { transform: scale(1); }
            50% { transform: scale(0.95) rotate(1deg); }
            100% { transform: scale(1); }
        }
        /* 底部小字提示 */
        .tip {
            margin-top: 40px;
            color: #a0784a;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <!-- 功德计数显示 -->
    <div class="merit">功德: <span id="count">0</span></div>
    <!-- 木鱼点击区域 -->
    <div class="wooden-fish" id="fish"></div>
    <!-- 底部提示 -->
    <div class="tip">点击木鱼，静心祈福</div>

    <!-- 木鱼敲击声音（隐藏音频控件，仅代码调用） -->
    <audio id="knockSound" preload="auto">
        <source src="https://fanyu.baidu.com/tts/evoke?text=%E6%9C%A8%E9%B1%BC%E5%A3%B0&lan=zh&spd=5&source=web" type="audio/mpeg">
    </audio>

    <script>
        // 获取页面元素
        const fish = document.getElementById('fish'); // 木鱼元素
        const countSpan = document.getElementById('count'); // 功德计数
        const knockSound = document.getElementById('knockSound'); // 敲击声音
        let meritCount = 0; // 初始功德数为0

        // 给木鱼添加点击事件（手机端点击、电脑端点击都支持）
        fish.addEventListener('click', function() {
            // 1. 播放敲击声音（重新播放，解决连续点击声音不触发问题）
            knockSound.currentTime = 0; // 重置音频到开头
            knockSound.play().catch(err => {
                // 兼容部分浏览器：首次点击需要用户交互，这里捕获错误不影响使用
                console.log('音频播放触发兼容机制', err);
            });

            // 2. 功德数+1并更新页面显示
            meritCount++;
            countSpan.innerText = meritCount;

            // 3. 添加敲击动画（先移除再添加，解决连续点击动画失效）
            fish.classList.remove('tap');
            void fish.offsetWidth; // 强制重绘DOM
            fish.classList.add('tap');
        });
    </script>
</body>
</html>
